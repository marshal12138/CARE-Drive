[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-drive"
version = "0.1.0"
description = "Coupled Alternating Refinement for Ego-trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.8,<3", "transformers==4.57.6", "numpy>=1.26,<2",
  "Pillow>=10", "PyYAML>=6", "safetensors>=0.4", "omegaconf>=2.3",
  "accelerate>=1.0", "timm==1.0.19", "einops>=0.8"
]

[tool.setuptools.packages.find]
include = ["care_drive*"]
